name: Unpack Bridge Core

on:
  push:
    paths:
      - 'bridge-core-v1.tar.gz.b64.part1'
      - 'bridge-core-v1.tar.gz.b64.part2'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check parts
        shell: bash
        run: |
          if [ ! -f bridge-core-v1.tar.gz.b64.part1 ] || [ ! -f bridge-core-v1.tar.gz.b64.part2 ]; then
            echo 'Waiting for both archive parts.'
            exit 0
          fi
      - name: Decode and unpack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .unpack
          mkdir .unpack
          cat bridge-core-v1.tar.gz.b64.part1 bridge-core-v1.tar.gz.b64.part2 | base64 -d > .unpack/bridge-core-v1.tar.gz
          tar -xzf .unpack/bridge-core-v1.tar.gz -C .unpack
          cp -a .unpack/bridge-core-v1/. ./
          rm -rf .unpack bridge-core-v1.tar.gz.b64.part1 bridge-core-v1.tar.gz.b64.part2
      - name: Commit unpacked source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Bridge Core v1 source' || exit 0
          git push
